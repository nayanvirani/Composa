api_version = "2026-07"

[[extensions]]
name = "Composa price fallback"
handle = "composa-price-fallback"
type = "function"
description = "Fallback cart mode: lowers the base variant to the signed configured price."

  [[extensions.targeting]]
  target = "cart.lines.discounts.generate.run"
  input_query = "src/cart_lines_discounts_generate_run.graphql"
  export = "cart-lines-discounts-generate-run"

  [extensions.build]
  command = ""
  path = "dist/function.wasm"

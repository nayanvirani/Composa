# Composa app configuration (Shopify CLI). Replace the placeholders, then run:
#   shopify app config link   (once, to attach this repo to the app in the Partner Dashboard)
#   shopify app deploy        (pushes this config and the extensions in ./extensions)
# Billing uses Shopify App Pricing (managed pricing): plans and prices are set in the Partner
# Dashboard, not here.

client_id = "52ff65100c1162390e066df49de70b78"
name = "Composa"
handle = "composa"
application_url = "https://composa.orderorbit.space/app"
embedded = true

[build]
automatically_update_urls_on_dev = false
include_config_on_deploy = true

[access_scopes]
scopes = "read_products,write_products,read_themes,write_cart_transforms,read_orders,write_orders,write_files,read_locales,read_markets,write_discounts"
use_legacy_install_flow = false

[auth]
redirect_urls = ["https://composa.orderorbit.space/app"]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [
    "app/uninstalled",
    "app/scopes_update",
    "app_subscriptions/update",
    "orders/create",
    "products/update",
    "products/delete",
    "shop/update",
    "themes/publish"
  ]
  uri = "https://composa.orderorbit.space/webhooks/shopify"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "https://composa.orderorbit.space/webhooks/shopify"

[app_proxy]
url = "https://composa.orderorbit.space/proxy"
prefix = "apps"
subpath = "composa"

[pos]
embedded = false
